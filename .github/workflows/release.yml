name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Build Ubuntu DEB (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libsqlite3-dev libboost-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev dpkg-dev

      - name: Build and package DEB
        run: |
          ./scripts/package_deb.sh
          OS_TAG=$(echo "${{ matrix.os }}" | tr -d '-')
          DEB_FILE=$(ls dist/modernime-*.deb | head -n 1)
          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          TARGET_NAME="modernime_${VERSION}_amd64_${OS_TAG}.deb"
          mv -f "$DEB_FILE" "dist/${TARGET_NAME}"

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.os }}
          path: dist/*.deb

  build-openeuler:
    name: Build openEuler RPM
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.09
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install openEuler dependencies
        run: |
          echo "timeout=60" >> /etc/dnf/dnf.conf
          echo "retries=5" >> /etc/dnf/dnf.conf
          sed -i 's/enabled=0/enabled=1/g' /etc/yum.repos.d/*.repo || true
          sed -i 's/gpgcheck=1/gpgcheck=0/g' /etc/yum.repos.d/*.repo || true
          sed -i 's|repo.openeuler.org|mirrors.huaweicloud.com|g' /etc/yum.repos.d/*.repo || true
          if ! dnf list fcitx5-devel >/dev/null 2>&1; then
            cat << 'EOF' > /etc/yum.repos.d/openEuler-24.09-epol.repo
          [openEuler-24.09-epol]
          name=openEuler 24.09 EPOL for Fcitx5
          baseurl=https://mirrors.huaweicloud.com/openeuler/openEuler-24.09/EPOL/main/$basearch/
          enabled=1
          gpgcheck=0
          priority=99
          EOF
          fi
          dnf makecache || true
          dnf install -y --nogpgcheck \
            gcc gcc-c++ cmake make pkgconf-pkg-config \
            sqlite-devel boost-devel \
            fcitx5-devel libime-devel \
            gtk3-devel pango-devel cairo-devel rpm-build tar

      - name: Build and package RPM
        run: |
          ./scripts/package_rpm.sh
          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          RPM_FILE=$(ls dist/*.rpm | head -n 1)
          TARGET_NAME="modernime-${VERSION}-1.oe24.x86_64.rpm"
          mv -f "$RPM_FILE" "dist/${TARGET_NAME}"

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-openeuler
          path: dist/*.rpm

  build-tarball:
    name: Build Standalone Tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libsqlite3-dev libboost-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev

      - name: Package tarball
        run: |
          ./scripts/package_tarball.sh

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-ubuntu, build-openeuler, build-tarball]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "ModernIME ${{ steps.get_tag.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-assets/*
