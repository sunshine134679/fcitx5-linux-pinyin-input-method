name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Existing Release Tag to publish (e.g. v0.1.10)'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

defaults:
  run:
    shell: bash

jobs:
  resolve-target:
    name: Resolve & Validate Release Tag Commit
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.target.outputs.tag }}
      version: ${{ steps.target.outputs.version }}
      source_sha: ${{ steps.target.outputs.source_sha }}
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch remote tags and resolve bound product source SHA
        id: target
        run: |
          set -euo pipefail
          git fetch --tags --force origin
          ./scripts/resolve_release_target.sh \
            --event-name "${{ github.event_name }}" \
            --ref-type "${{ github.ref_type }}" \
            --ref-name "${{ github.ref_name }}" \
            --input-tag "${{ github.event.inputs.tag_name }}" \
            --repo-dir "." \
            --github-output "$GITHUB_OUTPUT"

  build-ubuntu:
    name: Build Ubuntu 24.04 DEB (${{ matrix.arch }})
    needs: [resolve-target]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            distro_tag: ubuntu24.04
            arch: amd64
            run_full_tests: true
          - runner: ubuntu-24.04-arm
            distro_tag: ubuntu24.04
            arch: arm64
            run_full_tests: false
    steps:
      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            git build-essential cmake pkg-config python3 ca-certificates \
            libsqlite3-dev liblmdb-dev libboost-dev libgtest-dev libbenchmark-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-bin libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev dpkg-dev

      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Verify algorithm and installation regressions before packaging
        if: ${{ matrix.run_full_tests }}
        run: |
          set -euo pipefail
          cmake -S . -B build/release-tests -DCMAKE_BUILD_TYPE=Release \
            -DMODERNIME_REQUIRE_FULL_TESTS=ON \
            -DMODERNIME_BUILD_FCITX5=ON \
            -DMODERNIME_BUILD_LIBIME_PINYIN=ON \
            -DMODERNIME_BUILD_SETTINGS=ON \
            -DMODERNIME_BUILD_UI_LAYOUT_TESTS=ON \
            -DMODERNIME_BUILD_TESTS=ON
          cmake --build build/release-tests --parallel 2
          ctest --test-dir build/release-tests --show-only=json-v1 > build/release-tests/registered-tests.json
          python3 tests/verify_required_tests.py \
            --check registration \
            --registered build/release-tests/registered-tests.json \
            --profile full \
            --stage final
          unset DISPLAY WAYLAND_DISPLAY GDK_BACKEND BROADWAY_DISPLAY
          mkdir -p "$PWD/build/release-tests/gtest_output"
          GTEST_OUTPUT="xml:$PWD/build/release-tests/gtest_output/personal_engine.xml" \
          ctest --test-dir build/release-tests --output-on-failure \
            --output-junit "$PWD/build/release-tests/junit.xml" \
            --parallel 2
          python3 tests/verify_required_tests.py \
            --check execution \
            --registered build/release-tests/registered-tests.json \
            --profile full \
            --stage final \
            --junit build/release-tests/junit.xml \
            --gtest-xml build/release-tests/gtest_output \
            --execution headless

      - name: Build and package DEB
        run: |
          set -euo pipefail
          ./scripts/package_deb.sh
          DEB_FILE=$(ls dist/modernime-*.deb | head -n 1)
          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          TARGET_NAME="modernime_${VERSION}_${{ matrix.arch }}_${{ matrix.distro_tag }}.deb"
          mv -f "$DEB_FILE" "dist/${TARGET_NAME}"
          dpkg-deb -I "dist/${TARGET_NAME}"
          dpkg-deb -c "dist/${TARGET_NAME}" | grep -F "modernime_fcitx5.so" >/dev/null
          dpkg-deb -c "dist/${TARGET_NAME}" | grep -F "modernime-settings" >/dev/null

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro_tag }}-${{ matrix.arch }}
          path: dist/*.deb

  build-debian:
    name: Build Debian DEB (${{ matrix.distro_tag }} / ${{ matrix.arch }})
    needs: [resolve-target]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: debian:trixie
            distro_tag: debian13
            arch: amd64
          - runner: ubuntu-24.04-arm
            container: debian:trixie
            distro_tag: debian13
            arch: arm64
          - runner: ubuntu-24.04
            container: debian:bookworm
            distro_tag: debian12
            arch: amd64
          - runner: ubuntu-24.04-arm
            container: debian:bookworm
            distro_tag: debian12
            arch: arm64
    steps:
      - name: Install Debian build dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential cmake pkg-config python3 ca-certificates file \
            libsqlite3-dev liblmdb-dev libboost-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-bin libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev dpkg-dev

      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Build and package DEB
        run: |
          set -euo pipefail
          ./scripts/package_deb.sh
          DEB_FILE=$(ls dist/modernime-*.deb | head -n 1)
          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          TARGET_NAME="modernime_${VERSION}_${{ matrix.arch }}_${{ matrix.distro_tag }}.deb"
          mv -f "$DEB_FILE" "dist/${TARGET_NAME}"
          dpkg-deb -I "dist/${TARGET_NAME}"
          dpkg-deb -c "dist/${TARGET_NAME}" | grep -F "modernime_fcitx5.so" >/dev/null
          dpkg-deb -c "dist/${TARGET_NAME}" | grep -F "modernime-settings" >/dev/null

      - name: Upload DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.distro_tag }}-${{ matrix.arch }}
          path: dist/*.deb

  build-rpm:
    name: Build RPM (${{ matrix.distro_id }} / ${{ matrix.arch }})
    needs: [resolve-target]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            container: openeuler/openeuler:24.09
            distro_id: oe2409
            distro_family: openeuler
            rpm_release: 1.oe2409
            asset_release: 1.oe24
            repo_name: modernime-openeuler-24.09
            repo_file: modernime-openeuler-24.09.repo
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: openeuler/openeuler:24.09
            distro_id: oe2409
            distro_family: openeuler
            rpm_release: 1.oe2409
            asset_release: 1.oe24
            repo_name: modernime-openeuler-24.09
            repo_file: modernime-openeuler-24.09.repo
            arch: aarch64
          - runner: ubuntu-24.04
            container: fedora:41
            distro_id: fc41
            distro_family: fedora
            rpm_release: 1.fc41
            asset_release: 1.fc41
            repo_name: modernime-fedora-41
            repo_file: modernime-fedora-41.repo
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: fedora:41
            distro_id: fc41
            distro_family: fedora
            rpm_release: 1.fc41
            asset_release: 1.fc41
            repo_name: modernime-fedora-41
            repo_file: modernime-fedora-41.repo
            arch: aarch64
          - runner: ubuntu-24.04
            container: fedora:42
            distro_id: fc42
            distro_family: fedora
            rpm_release: 1.fc42
            asset_release: 1.fc42
            repo_name: modernime-fedora-42
            repo_file: modernime-fedora-42.repo
            arch: x86_64
          - runner: ubuntu-24.04-arm
            container: fedora:42
            distro_id: fc42
            distro_family: fedora
            rpm_release: 1.fc42
            asset_release: 1.fc42
            repo_name: modernime-fedora-42
            repo_file: modernime-fedora-42.repo
            arch: aarch64
    steps:
      - name: Install RPM build dependencies
        run: |
          set -euo pipefail
          echo "timeout=60" >> /etc/dnf/dnf.conf
          echo "retries=5" >> /etc/dnf/dnf.conf
          echo "max_parallel_downloads=10" >> /etc/dnf/dnf.conf
          if [ "${{ matrix.distro_family }}" = "openeuler" ]; then
            dnf config-manager --set-enabled EPOL || true
            if ! dnf list fcitx5-devel >/dev/null 2>&1; then
              cat << 'EOF' > /etc/yum.repos.d/openEuler-24.09-epol.repo
          [openEuler-24.09-epol]
          name=openEuler 24.09 EPOL for Fcitx5
          baseurl=https://repo.openeuler.org/openEuler-24.09/EPOL/main/$basearch/
          enabled=1
          gpgcheck=1
          gpgkey=https://repo.openeuler.org/openEuler-24.09/OS/$basearch/RPM-GPG-KEY-openEuler
          priority=99
          EOF
            fi
            APPINDICATOR_PKG="libappindicator-gtk3-devel"
          else
            APPINDICATOR_PKG="libayatana-appindicator-gtk3-devel"
          fi
          dnf makecache || true
          dnf install -y \
            git gcc gcc-c++ cmake make pkgconf-pkg-config \
            sqlite sqlite-libs sqlite-devel lmdb-libs lmdb-devel boost-devel \
            fcitx5 fcitx5-devel libime libime-devel \
            gtk3 gtk3-devel pango pango-devel cairo cairo-devel "${APPINDICATOR_PKG}" \
            desktop-file-utils hicolor-icon-theme python3 ca-certificates cpio gzip tar \
            rpm rpm-build rpm-sign dnf gnupg2

          for native_tool in git rpm rpmkeys rpmsign dnf rpmbuild; do
            if ! command -v "$native_tool" >/dev/null 2>&1; then
              echo "FATAL: Required native RPM tool missing: $native_tool" >&2
              exit 1
            fi
          done

      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Build and package RPM
        run: |
          set -euo pipefail
          export MODERNIME_REQUIRE_NATIVE_RPM_TOOLS=1
          export MODERNIME_RPM_RELEASE="${{ matrix.rpm_release }}"
          export MODERNIME_RPM_ARCH="${{ matrix.arch }}"
          ./scripts/package_rpm.sh
          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          RPM_FILE=$(ls dist/*.rpm | head -n 1)
          TARGET_NAME="modernime-${VERSION}-${{ matrix.asset_release }}.${{ matrix.arch }}.rpm"
          if [ "$RPM_FILE" != "dist/${TARGET_NAME}" ]; then
            mv -f "$RPM_FILE" "dist/${TARGET_NAME}"
          fi
          rpm_files=$(rpm -qpl "dist/${TARGET_NAME}")
          echo "$rpm_files"
          if echo "$rpm_files" | grep -Fq "(contains no files)"; then
            echo "FATAL: rpm -qpl reported (contains no files)" >&2
            exit 1
          fi
          echo "$rpm_files" | grep -Fx "/usr/share/modernime/install-channel.txt" >/dev/null
          echo "$rpm_files" | grep -Fx "/usr/bin/modernime-settings" >/dev/null
          echo "$rpm_files" | grep -E "^/usr/lib(64)?/fcitx5/modernime_fcitx5\.so$" >/dev/null

      - name: Verify Signed RPM & DNF Repository in Container
        run: |
          set -euo pipefail
          for native_tool in rpm rpmkeys rpmsign dnf; do
            command -v "$native_tool" >/dev/null 2>&1 || { echo "FATAL: missing $native_tool" >&2; exit 1; }
          done

          assert_normal_nonzero_failure() {
            local desc="$1"
            shift
            local rc=0
            "$@" || rc=$?
            if [ "$rc" -eq 0 ] || [ "$rc" -ge 124 ]; then
              echo "FATAL: $desc (expected normal non-zero exit 1..123, got $rc)" >&2
              exit 1
            fi
          }

          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          TARGET_RPM="dist/modernime-${VERSION}-${{ matrix.asset_release }}.${{ matrix.arch }}.rpm"
          SANDBOX_RPM="/tmp/modernime-${VERSION}-${{ matrix.asset_release }}.${{ matrix.arch }}.rpm"
          cp -f "$TARGET_RPM" "$SANDBOX_RPM"

          RPM_018="/tmp/modernime-0.1.8-${{ matrix.asset_release }}.${{ matrix.arch }}.rpm"
          python3 - "$SANDBOX_RPM" "$RPM_018" "$VERSION" <<'PYEOF'
          import gzip, hashlib, struct, sys
          from pathlib import Path
          raw = Path(sys.argv[1]).read_bytes()
          dst_path = Path(sys.argv[2])
          cur_ver = sys.argv[3]
          assert len(cur_ver) >= len("0.1.8"), "Current version cannot be shorter than the fixture"
          padding = len(cur_ver) - len("0.1.8")
          lead_name = raw[10:76].rstrip(b"\x00").replace(cur_ver.encode("ascii"), b"0.1.8")
          lead = raw[:10] + lead_name.ljust(66, b"\x00") + raw[76:96]
          nindex, hsize = struct.unpack(">II", raw[104:112])
          sig_end = (112 + nindex * 16 + hsize + 7) & ~7
          if raw[sig_end : sig_end + 4] != b"\x8e\xad\xe8\x01":
              sig_end = raw.find(b"\x8e\xad\xe8\x01", 112 + nindex * 16 + hsize)
          m_nindex, m_hsize = struct.unpack(">II", raw[sig_end + 8 : sig_end + 16])
          payload_off = sig_end + 16 + m_nindex * 16 + m_hsize
          main_hdr = raw[sig_end:payload_off]
          old_payload_gz = raw[payload_off:]
          old_cpio = gzip.decompress(old_payload_gz)
          old_chan = f"channel=rpm\nversion={cur_ver}\nprefix=/usr\n".encode("ascii")
          new_chan = b"channel=rpm\nversion=0.1.8\nprefix=/usr\n" + b"\n" * padding
          new_cpio = old_cpio.replace(old_chan, new_chan)
          new_payload_gz = gzip.compress(new_cpio, compresslevel=6)
          new_main_hdr = (
              main_hdr.replace(hashlib.sha256(old_chan).hexdigest().encode("ascii"), hashlib.sha256(new_chan).hexdigest().encode("ascii"))
              .replace(hashlib.sha256(old_payload_gz).hexdigest().encode("ascii"), hashlib.sha256(new_payload_gz).hexdigest().encode("ascii"))
              .replace(hashlib.sha256(old_cpio).hexdigest().encode("ascii"), hashlib.sha256(new_cpio).hexdigest().encode("ascii"))
              .replace(cur_ver.encode("ascii") + b"\x00", b"0.1.8" + b"\x00" * (padding + 1))
          )
          dst_path.write_bytes(lead + raw[96:sig_end] + new_main_hdr + new_payload_gz)
          PYEOF

          GPG_HOME="/tmp/rpm-gpg-home"
          rm -rf "$GPG_HOME"
          mkdir -p "$GPG_HOME"
          chmod 700 "$GPG_HOME"
          cat > "$GPG_HOME/gpg-agent.conf" <<'EOF'
          default-cache-ttl 0
          max-cache-ttl 0
          allow-loopback-pinentry
          pinentry-program /bin/false
          EOF
          chmod 600 "$GPG_HOME/gpg-agent.conf"
          unset DISPLAY WAYLAND_DISPLAY
          export GPG_TTY=""
          PASSPHRASE="ReleaseGateTestKey2026!"
          gpg --homedir "$GPG_HOME" --batch --no-tty --pinentry-mode loopback --passphrase "$PASSPHRASE" --generate-key <<GPGEOF
          Key-Type: RSA
          Key-Length: 2048
          Passphrase: ${PASSPHRASE}
          Name-Real: ModernIME Release Gate Key
          Name-Email: release-gate@modernime.org
          Expire-Date: 0
          %commit
          GPGEOF
          gpg-connect-agent --homedir "$GPG_HOME" reloadagent /bye >/dev/null 2>&1 || true
          KEY_FPR=$(gpg --homedir "$GPG_HOME" --list-secret-keys --with-colons "release-gate@modernime.org" | awk -F: '$1 == "fpr" { print $10; exit }')

          export MODERNIME_REQUIRE_NATIVE_RPM_TOOLS=1
          export MODERNIME_REQUIRE_RPMKEYS=1

          assert_normal_nonzero_failure "missing passphrase" \
            timeout 15s env -u MODERNIME_GPG_PASSPHRASE MODERNIME_DISABLE_RPMSIGN=0 \
            ./scripts/build_rpm_repo.sh --output-dir /tmp/rpm-repo-miss --distro "${{ matrix.distro_id }}" --arch "${{ matrix.arch }}" --rpm "$SANDBOX_RPM" --gpg-home "$GPG_HOME" --gpg-key-id "$KEY_FPR"

          assert_normal_nonzero_failure "wrong passphrase" \
            timeout 15s env MODERNIME_DISABLE_RPMSIGN=0 \
            ./scripts/build_rpm_repo.sh --output-dir /tmp/rpm-repo-wrong --distro "${{ matrix.distro_id }}" --arch "${{ matrix.arch }}" --rpm "$SANDBOX_RPM" --gpg-home "$GPG_HOME" --gpg-key-id "$KEY_FPR" --gpg-passphrase "WrongPassphrase!"

          ./scripts/build_rpm_repo.sh \
            --output-dir /tmp/rpm-repo \
            --distro "${{ matrix.distro_id }}" \
            --arch "${{ matrix.arch }}" \
            --rpm "$RPM_018" \
            --rpm "$SANDBOX_RPM" \
            --gpg-home "$GPG_HOME" \
            --gpg-key-id "$KEY_FPR" \
            --gpg-passphrase "$PASSPHRASE" \
            --repo-url "file:///tmp/rpm-repo"

          rpmkeys --import /tmp/rpm-repo/RPM-GPG-KEY-modernime
          rpm --import /tmp/rpm-repo/RPM-GPG-KEY-modernime
          rpmkeys -v -K /tmp/rpm-repo/${{ matrix.distro_id }}/${{ matrix.arch }}/Packages/*.rpm
          rpm -v -K /tmp/rpm-repo/${{ matrix.distro_id }}/${{ matrix.arch }}/Packages/*.rpm

          cp -f "/tmp/rpm-repo/client/${{ matrix.repo_file }}" /etc/yum.repos.d/local-modernime.repo
          sed -i "s|^baseurl=.*|baseurl=file:///tmp/rpm-repo/${{ matrix.distro_id }}/${{ matrix.arch }}|" /etc/yum.repos.d/local-modernime.repo
          sed -i 's|^gpgkey=.*|gpgkey=file:///tmp/rpm-repo/RPM-GPG-KEY-modernime|' /etc/yum.repos.d/local-modernime.repo
          dnf clean all -y --disablerepo="*" --enablerepo="${{ matrix.repo_name }}"
          dnf makecache -y --disablerepo="*" --enablerepo="${{ matrix.repo_name }}"
          dnf install -y --disablerepo="*" --enablerepo="${{ matrix.repo_name }}" "modernime-0.1.8-${{ matrix.rpm_release }}"
          test "$(rpm -q --qf '%{VERSION}' modernime)" = "0.1.8"
          dnf upgrade -y --disablerepo="*" --enablerepo="${{ matrix.repo_name }}" modernime
          test "$(rpm -q --qf '%{VERSION}' modernime)" = "$VERSION"
          rpm -V modernime
          test -x /usr/bin/modernime-settings
          test "$(stat -c '%a' /usr/bin/modernime-settings)" = "755"
          test -f /usr/share/modernime/install-channel.txt
          test "$(stat -c '%a' /usr/share/modernime/install-channel.txt)" = "644"
          grep -Fx "channel=rpm" /usr/share/modernime/install-channel.txt
          dnf downgrade -y --disablerepo="*" --enablerepo="${{ matrix.repo_name }}" "modernime-0.1.8-${{ matrix.rpm_release }}"
          test "$(rpm -q --qf '%{VERSION}' modernime)" = "0.1.8"
          rpm -V modernime
          dnf remove -y modernime
          test ! -e /usr/bin/modernime-settings
          test ! -e /usr/share/modernime/install-channel.txt
          gpgconf --homedir "$GPG_HOME" --kill gpg-agent >/dev/null 2>&1 || true
          rm -f /etc/yum.repos.d/local-modernime.repo "$SANDBOX_RPM" "$RPM_018"
          rm -rf /tmp/rpm-repo /tmp/rpm-repo-miss /tmp/rpm-repo-wrong "$GPG_HOME"

      - name: Upload RPM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ matrix.distro_id }}-${{ matrix.arch }}
          path: dist/*.rpm

  build-arch:
    name: Build Arch Linux Package (x86_64)
    needs: [resolve-target]
    runs-on: ubuntu-24.04
    container:
      image: archlinux:latest
    steps:
      - name: Install Arch Linux build dependencies
        run: |
          set -euo pipefail
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            git base-devel cmake pkgconf boost \
            fcitx5 libime gtk3 pango cairo sqlite lmdb \
            libayatana-appindicator python ca-certificates \
            desktop-file-utils hicolor-icon-theme zstd tar gnupg

      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Build and verify Arch Linux package & Pacman repo
        run: |
          set -euo pipefail
          ./scripts/package_arch.sh
          VERSION=$(grep -oP 'project\(ModernIME VERSION \K[0-9.]+' CMakeLists.txt)
          PKG_FILE="dist/modernime-${VERSION}-1-x86_64.pkg.tar.zst"
          test -f "$PKG_FILE"
          pkg_files=$(pacman -Qpl "$PKG_FILE")
          echo "$pkg_files" | grep -Fx "modernime /usr/bin/modernime-settings" >/dev/null
          echo "$pkg_files" | grep -Fx "modernime /usr/share/modernime/install-channel.txt" >/dev/null
          echo "$pkg_files" | grep -Fx "modernime /usr/lib/fcitx5/modernime_fcitx5.so" >/dev/null

          # Verify real pacman install + signature check via local signed Pacman repository
          ./scripts/build_pacman_repo.sh \
            --output-dir /tmp/arch-repo \
            --pkg "$PKG_FILE" \
            --arch x86_64 \
            --ephemeral-gpg \
            --repo-url "file:///tmp/arch-repo"
          FPR=$(gpg --show-keys --with-colons /tmp/arch-repo/modernime-arch-keyring.asc | awk -F: '/^fpr:/{print $10; exit}')
          pacman-key --init
          pacman-key --add /tmp/arch-repo/modernime-arch-keyring.asc
          pacman-key --lsign-key "$FPR"
          cp -f /etc/pacman.conf /tmp/pacman.conf.bak
          cat >> /etc/pacman.conf <<'EOF'

          [modernime]
          SigLevel = Required DatabaseRequired
          Server = file:///tmp/arch-repo/$arch
          EOF
          pacman -Sy --noconfirm
          pacman -S --noconfirm modernime
          test -x /usr/bin/modernime-settings
          grep -Fx "channel=pacman" /usr/share/modernime/install-channel.txt
          pacman -R --noconfirm modernime
          test ! -e /usr/bin/modernime-settings
          mv -f /tmp/pacman.conf.bak /etc/pacman.conf
          rm -rf /tmp/arch-repo

      - name: Upload Arch Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: dist/*.pkg.tar.zst

  build-tarball-x86_64:
    name: Build Standalone Tarball (x86_64, glibc 2.34+ Baseline)
    needs: [resolve-target]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config python3 ca-certificates \
            libsqlite3-dev liblmdb-dev libboost-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-bin libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev

      - name: Package tarball
        run: |
          MODERNIME_TARBALL_ARCH=x86_64 ./scripts/package_tarball.sh

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux-x86_64
          path: dist/*.tar.gz

  build-tarball-aarch64:
    name: Build Standalone Tarball (aarch64, glibc 2.34+ Baseline)
    needs: [resolve-target]
    runs-on: ubuntu-24.04-arm
    container:
      image: ubuntu:22.04
    steps:
      - name: Install dependencies
        run: |
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y \
            git build-essential python3-pip pkg-config python3 ca-certificates \
            libsqlite3-dev liblmdb-dev libboost-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-bin libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev
          pip3 install --no-cache-dir "cmake>=3.24,<4"
          cmake --version

      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE" || true
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Package tarball
        run: |
          MODERNIME_TARBALL_ARCH=aarch64 ./scripts/package_tarball.sh

      - name: Upload Tarball Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tarball-linux-aarch64
          path: dist/*.tar.gz

  publish-release:
    name: Publish GitHub Release & Signed Package Repositories
    needs: [resolve-target, build-ubuntu, build-debian, build-rpm, build-arch, build-tarball-x86_64, build-tarball-aarch64]
    runs-on: ubuntu-latest
    concurrency:
      group: modernime-pages-sync
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy_pages.outputs.page_url }}
    steps:
      - name: Checkout bound product source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-target.outputs.source_sha }}
          fetch-depth: 0

      - name: Verify bound product source SHA and version
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse --verify HEAD)"
          expected_sha="${{ needs.resolve-target.outputs.source_sha }}"
          expected_ver="${{ needs.resolve-target.outputs.version }}"
          target_tag="${{ needs.resolve-target.outputs.tag }}"
          cmake_ver="$(sed -n 's/^project(ModernIME VERSION \([0-9.][0-9.]*\) LANGUAGES CXX)$/\1/p' CMakeLists.txt)"
          echo "Release Tag: ${target_tag}"
          echo "Product Source Commit SHA: ${actual_sha}"
          echo "Expected Source Commit SHA: ${expected_sha}"
          echo "CMake Project Version: ${cmake_ver}"
          test "$actual_sha" = "$expected_sha"
          test "$cmake_ver" = "$expected_ver"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Install release gate and repository dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            liblmdb0 \
            dpkg-dev \
            gnupg \
            python3 \
            tar \
            zstd \
            coreutils
          for req_tool in python3 dpkg-deb dpkg-scanpackages gpg gpgv tar zstd sha256sum cmp; do
            if ! command -v "$req_tool" >/dev/null 2>&1; then
              echo "FATAL: Required release gate tool missing: $req_tool" >&2
              exit 1
            fi
          done
          python3 - <<'PYEOF'
          import ctypes
          lib = ctypes.CDLL("liblmdb.so.0")
          assert hasattr(lib, "mdb_env_create"), "liblmdb.so.0 missing mdb_env_create"
          PYEOF

      - name: Verify Release Assets & Upgrade Lifecycle Gate
        run: |
          set -euo pipefail
          gate_log="$(mktemp)"
          report_gate_failure() {
            local rc=$?
            local line_no=${1:-0}
            sleep 0.3
            local tail_txt
            tail_txt=$(tail -n 25 "$gate_log" 2>/dev/null | tr '\n' '|' | sed 's/|/ ; /g' | cut -c1-1800)
            echo "::error title=Verify Release Assets Failed (line ${line_no}, rc=${rc})::${tail_txt}" >&2
            rm -f -- "$gate_log"
            exit "$rc"
          }
          trap 'report_gate_failure $LINENO' ERR
          exec > >(tee -a "$gate_log") 2>&1
          repo_root="$(pwd)"
          cd release-assets
          echo "=== 1. 检查发布产物完整性与命名规范 ==="
          ls -la
          for deb_pat in \
            "modernime_*_amd64_ubuntu24.04.deb" \
            "modernime_*_arm64_ubuntu24.04.deb" \
            "modernime_*_amd64_debian13.deb" \
            "modernime_*_arm64_debian13.deb" \
            "modernime_*_amd64_debian12.deb" \
            "modernime_*_arm64_debian12.deb"; do
            test "$(ls -1 ${deb_pat} 2>/dev/null | wc -l)" -eq 1
          done
          for rpm_pat in \
            "modernime-*.oe24.x86_64.rpm" \
            "modernime-*.oe24.aarch64.rpm" \
            "modernime-*.fc41.x86_64.rpm" \
            "modernime-*.fc41.aarch64.rpm" \
            "modernime-*.fc42.x86_64.rpm" \
            "modernime-*.fc42.aarch64.rpm"; do
            test "$(ls -1 ${rpm_pat} 2>/dev/null | wc -l)" -eq 1
          done
          test "$(ls -1 modernime-*-1-x86_64.pkg.tar.zst 2>/dev/null | wc -l)" -eq 1
          test "$(ls -1 modernime-*-linux-x86_64.tar.gz 2>/dev/null | wc -l)" -eq 1
          test "$(ls -1 modernime-*-linux-aarch64.tar.gz 2>/dev/null | wc -l)" -eq 1
          for deb in *.deb; do
            dpkg-deb -I "$deb" >/dev/null
            dpkg-deb -c "$deb" | grep -F "modernime_fcitx5.so" >/dev/null
          done
          for tarball in *.tar.gz; do
            tar -tzf "$tarball" >/dev/null
          done

          echo "=== 2. 验证便携式发行包真实资产升级与回退事务 ==="
          gate_dir="$(mktemp -d)"
          trap 'rm -rf -- "$gate_dir"' EXIT
          tar -xzf modernime-*-linux-x86_64.tar.gz -C "$gate_dir"
          extracted_dir="$(find "$gate_dir" -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          test -n "$extracted_dir"
          test -f "$extracted_dir/install.sh"
          test -f "$extracted_dir/uninstall.sh"

          prefix="$gate_dir/prefix"
          data_home="$gate_dir/data"
          config_home="$gate_dir/config"
          mkdir -p "$prefix/lib/fcitx5" "$prefix/share/modernime/pinyin" "$prefix/bin" \
                   "$data_home/modernime" "$config_home/modernime" "$gate_dir/home" "$gate_dir/Desktop"
          printf 'v0.1.6-legacy\n' > "$prefix/lib/fcitx5/modernime_fcitx5.so"
          printf 'v0.1.6-legacy\n' > "$prefix/lib/fcitx5/modernime_ui.so"
          "$repo_root/scripts/modernime-data-guard" --init-lmdb "$data_home/modernime/learning.lmdb"
          python3 - "$data_home/modernime/learning.sqlite3" <<'PYEOF'
          import sqlite3, sys
          conn = sqlite3.connect(sys.argv[1])
          conn.execute("PRAGMA journal_mode=WAL;")
          conn.execute("CREATE TABLE learning_entries (id INTEGER PRIMARY KEY, pinyin TEXT, phrase TEXT);")
          conn.execute("INSERT INTO learning_entries VALUES (1, 'ceshi', '测试');")
          conn.commit()
          conn.close()
          PYEOF

          echo "--- 2a. 升级前校验合法 SQLite 与 LMDB 数据库 ---"
          "$repo_root/scripts/modernime-data-guard" --verify \
            --data-dir "$data_home/modernime" \
            --config-dir "$config_home/modernime"

          HOME="$gate_dir/home" \
          MODERNIME_PREFIX="$prefix" \
          MODERNIME_DATA_HOME="$data_home" \
          MODERNIME_CONFIG_HOME="$config_home" \
          MODERNIME_DESKTOP_DIR="$gate_dir/Desktop" \
          MODERNIME_SKIP_FCITX_RESTART=1 \
          MODERNIME_ALLOW_MISSING_DEPS=1 \
          XDG_DATA_HOME="$data_home" \
          XDG_CONFIG_HOME="$config_home" \
          bash "$extracted_dir/install.sh" "$prefix"

          test -x "$prefix/bin/modernime-settings"
          test -x "$prefix/bin/modernime-session-init"
          test -x "$prefix/bin/modernime-data-guard"
          backup_db="$(find "$data_home/modernime" -maxdepth 1 -name 'learning.sqlite3.backup-*' ! -name '*-wal' ! -name '*-shm' -print -quit)"
          test -n "$backup_db" && test -f "$backup_db"
          backup_lmdb="$(find "$data_home/modernime" -maxdepth 1 -name 'learning.lmdb.backup-*' ! -name '*-lock' -print -quit)"
          test -n "$backup_lmdb" && test -e "$backup_lmdb"
          test -f "$data_home/modernime/backups/latest"
          latest_backup_dir="$(cat "$data_home/modernime/backups/latest")"
          test -d "$latest_backup_dir"

          echo "--- 2b. 备份与升级后校验在线库及备份副本 ---"
          "$prefix/bin/modernime-data-guard" --verify \
            --data-dir "$data_home/modernime" \
            --config-dir "$config_home/modernime"
          "$prefix/bin/modernime-data-guard" --verify \
            --data-dir "$latest_backup_dir"
          python3 - "$repo_root/scripts/modernime-data-guard" "$backup_db" "$backup_lmdb" <<'PYEOF'
          import importlib.machinery, importlib.util, sqlite3, sys
          from pathlib import Path
          guard_path, backup_db, backup_lmdb = sys.argv[1], sys.argv[2], sys.argv[3]
          loader = importlib.machinery.SourceFileLoader("modernime_data_guard", guard_path)
          spec = importlib.util.spec_from_loader(loader.name, loader)
          mod = importlib.util.module_from_spec(spec)
          loader.exec_module(mod)
          sql_info = mod.verify_sqlite(Path(backup_db))
          lmdb_info = mod.verify_lmdb(Path(backup_lmdb))
          assert sql_info["entries_count"] == 1, f"Unexpected SQLite entries_count: {sql_info}"
          assert lmdb_info["words_count"] >= 1, f"Unexpected LMDB words_count: {lmdb_info}"
          conn = sqlite3.connect(backup_db)
          assert conn.execute("PRAGMA integrity_check;").fetchone()[0] == "ok"
          assert conn.execute("SELECT phrase FROM learning_entries WHERE pinyin='ceshi';").fetchone()[0] == "测试"
          conn.close()
          PYEOF

          HOME="$gate_dir/home" \
          MODERNIME_PREFIX="$prefix" \
          MODERNIME_DATA_HOME="$data_home" \
          MODERNIME_CONFIG_HOME="$config_home" \
          MODERNIME_DESKTOP_DIR="$gate_dir/Desktop" \
          MODERNIME_SKIP_FCITX_RESTART=1 \
          bash "$extracted_dir/uninstall.sh" --prefix="$prefix"
          test ! -e "$prefix/bin/modernime-settings"
          test -f "$data_home/modernime/learning.sqlite3"
          test -f "$data_home/modernime/learning.lmdb"

          echo "--- 2c. 卸载后再次校验保留的用户 SQLite 与 LMDB 数据库 ---"
          "$repo_root/scripts/modernime-data-guard" --verify \
            --data-dir "$data_home/modernime" \
            --config-dir "$config_home/modernime"

          echo "--- 2d. 验证损坏数据库必须阻断便携包安装且不覆盖现有组件 ---"
          corrupt_root="$gate_dir/corrupt-check"
          corrupt_prefix="$corrupt_root/prefix"
          corrupt_data="$corrupt_root/data"
          corrupt_config="$corrupt_root/config"
          mkdir -p "$corrupt_prefix/lib/fcitx5" "$corrupt_data/modernime" "$corrupt_config/modernime" \
                   "$corrupt_root/home" "$corrupt_root/Desktop"
          printf 'v0.1.6-legacy\n' > "$corrupt_prefix/lib/fcitx5/modernime_fcitx5.so"
          printf 'corrupt-lmdb-payload\n' > "$corrupt_data/modernime/learning.lmdb"
          corrupt_rc=0
          HOME="$corrupt_root/home" \
          MODERNIME_PREFIX="$corrupt_prefix" \
          MODERNIME_DATA_HOME="$corrupt_data" \
          MODERNIME_CONFIG_HOME="$corrupt_config" \
          MODERNIME_DESKTOP_DIR="$corrupt_root/Desktop" \
          MODERNIME_SKIP_FCITX_RESTART=1 \
          MODERNIME_ALLOW_MISSING_DEPS=1 \
          XDG_DATA_HOME="$corrupt_data" \
          XDG_CONFIG_HOME="$corrupt_config" \
          bash "$extracted_dir/install.sh" "$corrupt_prefix" >/dev/null 2>&1 || corrupt_rc=$?
          if [ "$corrupt_rc" -eq 0 ] || [ "$corrupt_rc" -ge 124 ]; then
            echo "FATAL: Corrupt LMDB did not block install.sh with normal non-zero exit (got $corrupt_rc)" >&2
            exit 1
          fi
          grep -Fxq "v0.1.6-legacy" "$corrupt_prefix/lib/fcitx5/modernime_fcitx5.so"
          test ! -e "$corrupt_prefix/bin/modernime-settings"

          echo "=== 3. 验证沙箱 APT/RPM/Pacman 仓库构建、包体签名与 GPG 验签门禁 ==="
          gate_assets="$gate_dir/assets-copy"
          mkdir -p "$gate_assets"
          cp -a "$repo_root/release-assets/." "$gate_assets/"
          sandbox_gpg="$gate_dir/sandbox-gpg"
          mkdir -p "$sandbox_gpg"
          chmod 700 "$sandbox_gpg"
          gpg --homedir "$sandbox_gpg" --batch --no-tty --generate-key <<'GPGEOF' 2>/dev/null
          %no-protection
          Key-Type: RSA
          Key-Length: 2048
          Name-Real: ModernIME Ephemeral Gate Key
          Name-Email: gate@modernime.invalid
          Expire-Date: 1d
          %commit
          GPGEOF
          sandbox_sec="$gate_dir/sandbox-ephemeral-sec.asc"
          gpg --homedir "$sandbox_gpg" --batch --no-tty --armor --export-secret-keys > "$sandbox_sec"
          gpgconf --homedir "$sandbox_gpg" --kill gpg-agent >/dev/null 2>&1 || true
          "$repo_root/scripts/ci_build_release_repos.sh" \
            --assets-dir "$gate_assets" \
            --pages-dir "$gate_dir/pages-sandbox" \
            --gpg-private-key-file "$sandbox_sec"

      - name: Build Production Signed APT, RPM & Arch Repositories
        env:
          MODERNIME_GPG_PRIVATE_KEY: ${{ secrets.MODERNIME_GPG_PRIVATE_KEY }}
          MODERNIME_GPG_KEY_ID: ${{ secrets.MODERNIME_GPG_KEY_ID }}
          MODERNIME_GPG_PASSPHRASE: ${{ secrets.MODERNIME_GPG_PASSPHRASE }}
          MODERNIME_GPG_ROTATION_PRIVATE_KEY: ${{ secrets.MODERNIME_GPG_ROTATION_PRIVATE_KEY }}
          MODERNIME_GPG_ROTATION_KEY_ID: ${{ secrets.MODERNIME_GPG_ROTATION_KEY_ID }}
        run: |
          set -euo pipefail
          prev_pages=""
          git ls-remote --heads origin refs/heads/gh-pages > previous-pages-ref.txt
          if [[ -s previous-pages-ref.txt ]]; then
            git fetch origin refs/heads/gh-pages:refs/remotes/origin/gh-pages
          fi
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add prev-pages origin/gh-pages
            prev_pages="prev-pages"
          fi
          ./scripts/ci_build_release_repos.sh \
            --assets-dir release-assets \
            --pages-dir pages-site \
            ${prev_pages:+--previous-pages-dir "$prev_pages"} \
            --require-persistent-gpg
          if [ -n "$prev_pages" ]; then
            git worktree remove --force "$prev_pages" || true
          fi

      - name: Verify Production-Signed Release RPM & Pages Byte Identity
        run: |
          set -euo pipefail
          VERSION="${{ needs.resolve-target.outputs.version }}"
          python3 - "release-assets" "pages-site/rpm" "${VERSION}" <<'PYEOF'
          from pathlib import Path
          import re, struct, subprocess, sys, tempfile

          assets_dir = Path(sys.argv[1]).resolve()
          rpm_repo = Path(sys.argv[2]).resolve()
          version = sys.argv[3]
          keyring = rpm_repo / "RPM-GPG-KEY-modernime.gpg"
          fpr_file = rpm_repo / "KEY-FINGERPRINTS.txt"
          allowed_fprs = re.findall(r"Fingerprint:\s*([0-9A-Fa-f]{40})", fpr_file.read_text(encoding="utf-8"))
          assert allowed_fprs, "No valid 40-hex fingerprints found in KEY-FINGERPRINTS.txt"

          key_info = subprocess.check_output(
              ["gpg", "--batch", "--with-colons", "--import-options", "show-only", "--import", str(assets_dir / "RPM-GPG-KEY-modernime")],
              text=True,
          )
          if re.search(r"modernime\.invalid|Ephemeral", key_info, re.IGNORECASE):
              raise SystemExit("Error: Ephemeral test GPG key detected in production release keyring!")

          targets = [
              ("oe2409", "x86_64", f"modernime-{version}-1.oe24.x86_64.rpm"),
              ("oe2409", "aarch64", f"modernime-{version}-1.oe24.aarch64.rpm"),
              ("fc41", "x86_64", f"modernime-{version}-1.fc41.x86_64.rpm"),
              ("fc41", "aarch64", f"modernime-{version}-1.fc41.aarch64.rpm"),
              ("fc42", "x86_64", f"modernime-{version}-1.fc42.x86_64.rpm"),
              ("fc42", "aarch64", f"modernime-{version}-1.fc42.aarch64.rpm"),
          ]
          for distro, arch, fname in targets:
              rel_rpm = assets_dir / fname
              assert rel_rpm.is_file(), f"Missing release RPM: {rel_rpm}"
              pages_matches = sorted((rpm_repo / distro / arch / "Packages").glob(f"modernime-{version}-*.{arch}.rpm"))
              assert len(pages_matches) == 1, f"Expected 1 pages RPM for {distro}/{arch}, got {pages_matches}"
              pages_rpm = pages_matches[0]
              assert rel_rpm.read_bytes() == pages_rpm.read_bytes(), f"Byte mismatch: {rel_rpm} vs {pages_rpm}"

              raw = rel_rpm.read_bytes()
              assert raw[96:100] == b"\x8e\xad\xe8\x01"
              nindex, hsize = struct.unpack(">II", raw[104:112])
              idx_start = 112
              store_start = idx_start + nindex * 16
              store_end = store_start + hsize
              sig_end = (store_end + 7) & ~7
              if raw[sig_end : sig_end + 4] != b"\x8e\xad\xe8\x01":
                  sig_end = raw.find(b"\x8e\xad\xe8\x01", store_end)
              main_nindex, main_hsize = struct.unpack(">II", raw[sig_end + 8 : sig_end + 16])
              main_end = sig_end + 16 + main_nindex * 16 + main_hsize
              main_hdr = raw[sig_end:main_end]
              hdr_and_payload = raw[sig_end:]
              sig_bin = {}
              for i in range(nindex):
                  eo = idx_start + i * 16
                  tag, dtype, voff, count = struct.unpack(">IIII", raw[eo : eo + 16])
                  if dtype == 7:
                      sig_bin[tag] = raw[store_start + voff : store_start + voff + count]
              assert 268 in sig_bin and 259 in sig_bin, f"Missing RSA/PGP signatures in {rel_rpm}"
              with tempfile.TemporaryDirectory() as td:
                  td_p = Path(td)
                  (td_p / "hdr.bin").write_bytes(main_hdr)
                  (td_p / "hdr.sig").write_bytes(sig_bin[268])
                  (td_p / "all.bin").write_bytes(hdr_and_payload)
                  (td_p / "all.sig").write_bytes(sig_bin[259])
                  for sig_f, data_f in [("hdr.sig", "hdr.bin"), ("all.sig", "all.bin")]:
                      res = subprocess.run(
                          ["gpgv", "--keyring", str(keyring), "--status-fd", "1", str(td_p / sig_f), str(td_p / data_f)],
                          capture_output=True, text=True, check=True,
                      )
                      assert any(f"VALIDSIG {fpr}" in res.stdout for fpr in allowed_fprs), f"{fname} {sig_f} invalid"
          print(f"Verified byte identity and OpenPGP signatures for {len(targets)} RPM artifacts.")
          PYEOF

      - name: Generate Detached GPG Signatures for Release Assets
        env:
          MODERNIME_GPG_PRIVATE_KEY: ${{ secrets.MODERNIME_GPG_PRIVATE_KEY }}
          MODERNIME_GPG_KEY_ID: ${{ secrets.MODERNIME_GPG_KEY_ID }}
          MODERNIME_GPG_PASSPHRASE: ${{ secrets.MODERNIME_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sig_gpg=$(mktemp -d)
          chmod 700 "$sig_gpg"
          cat > "$sig_gpg/gpg-agent.conf" <<'EOF'
          default-cache-ttl 0
          max-cache-ttl 0
          allow-loopback-pinentry
          pinentry-program /bin/false
          EOF
          chmod 600 "$sig_gpg/gpg-agent.conf"
          export GNUPGHOME="$sig_gpg"
          export GPG_TTY=""
          unset DISPLAY WAYLAND_DISPLAY
          printf '%s\n' "$MODERNIME_GPG_PRIVATE_KEY" | gpg --batch --no-tty --quiet --pinentry-mode loopback --passphrase "${MODERNIME_GPG_PASSPHRASE:-}" --import
          key_id="${MODERNIME_GPG_KEY_ID:-$(gpg --batch --no-tty --with-colons --list-secret-keys | awk -F: '/^sec:/ {print $5; exit}')}"
          for asset in release-assets/*.deb release-assets/*.rpm release-assets/*.pkg.tar.zst release-assets/*.tar.gz; do
            [ -f "$asset" ] || continue
            gpg --batch --no-tty --yes --pinentry-mode loopback --passphrase "${MODERNIME_GPG_PASSPHRASE:-}" \
              -u "$key_id" --digest-algo SHA256 --armor --detach-sign -o "${asset}.sig" "$asset"
          done
          gpgconf --homedir "$sig_gpg" --kill gpg-agent >/dev/null 2>&1 || true
          rm -rf -- "$sig_gpg"

      - name: Compute Checksums
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload Signed Release Assets Bundle
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

      # Website copy is independent of the immutable product release tag.
      # Re-publishing an older tag must preserve the current official homepage.
      - name: Checkout current official website
        uses: actions/checkout@v4
        with:
          ref: main
          path: official-website-source
          sparse-checkout: |
            website
            scripts/prepare_website.py
          sparse-checkout-cone-mode: false

      - name: Include official website without changing package repositories
        run: |
          python3 official-website-source/scripts/prepare_website.py \
            --source official-website-source/website --destination pages-site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload APT, RPM & Arch Repository Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

      - name: Deploy APT, RPM & Arch Repositories to GitHub Pages
        id: deploy_pages
        uses: actions/deploy-pages@v4

      - name: Persist Pages Site to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          tag="${{ needs.resolve-target.outputs.tag }}"

          work_pages=$(mktemp -d)
          if git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" -b gh-pages "$work_pages" 2>/dev/null; then
            echo "Existing gh-pages branch cloned"
          else
            echo "Initializing orphan gh-pages branch"
            git clone "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" "$work_pages"
            cd "$work_pages"
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
            cd -
          fi

          cp -a pages-site/. "$work_pages/"
          cd "$work_pages"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit in gh-pages"
          else
            git commit -m "deploy: update APT, RPM & Arch repositories for ${tag}"
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
          fi
          cd -
          rm -rf "$work_pages"

      - name: Prepare Release Notes
        env:
          RELEASE_TAG: ${{ needs.resolve-target.outputs.tag }}
          SOURCE_SHA: ${{ needs.resolve-target.outputs.source_sha }}
        run: |
          set -euo pipefail
          notes="docs/releases/${RELEASE_TAG}.md"
          if [[ -f "$notes" ]]; then
            cat "$notes" > release-notes.md
          else
            printf '# ModernIME %s\n' "$RELEASE_TAG" > release-notes.md
          fi
          printf '\n## 构建源码\n\n所有发行包均来自标签 `%s` 对应的提交 `%s`。\n' "$RELEASE_TAG" "$SOURCE_SHA" >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.resolve-target.outputs.tag }}
          name: "ModernIME ${{ needs.resolve-target.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: release-notes.md
          files: |
            release-assets/*
