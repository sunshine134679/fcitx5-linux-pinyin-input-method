name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-ubuntu:
    name: Ubuntu Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libsqlite3-dev libboost-dev \
            libfcitx5core-dev libfcitx5utils-dev fcitx5-modules-dev fcitx5 \
            libimecore-dev libimepinyin-dev libime-data libime-data-language-model fcitx5-chinese-addons \
            libgtk-3-dev libpango1.0-dev libayatana-appindicator3-dev dpkg-dev

      - name: Configure and build
        run: |
          cmake -S . -B build/ci -DCMAKE_BUILD_TYPE=Debug \
            -DMODERNIME_BUILD_FCITX5=ON \
            -DMODERNIME_BUILD_LIBIME_PINYIN=ON \
            -DMODERNIME_BUILD_SETTINGS=ON \
            -DMODERNIME_BUILD_TESTS=ON
          cmake --build build/ci --parallel $(nproc)

      - name: Run headless CTest
        run: |
          unset DISPLAY WAYLAND_DISPLAY GDK_BACKEND BROADWAY_DISPLAY
          ctest --test-dir build/ci --output-on-failure -E 'settings_focus_gtk|settings_shell_gtk' --parallel $(nproc)

      - name: Verify DEB packaging
        run: |
          ./scripts/package_deb.sh
          dpkg-deb -I dist/modernime-*.deb
          dpkg-deb -c dist/modernime-*.deb

  test-openeuler:
    name: openEuler Build Verification
    runs-on: ubuntu-latest
    container:
      image: openeuler/openeuler:24.09
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install openEuler dependencies
        run: |
          echo "timeout=60" >> /etc/dnf/dnf.conf
          echo "retries=5" >> /etc/dnf/dnf.conf
          sed -i 's/enabled=0/enabled=1/g' /etc/yum.repos.d/*.repo || true
          sed -i 's/gpgcheck=1/gpgcheck=0/g' /etc/yum.repos.d/*.repo || true
          sed -i 's|repo.openeuler.org|mirrors.huaweicloud.com|g' /etc/yum.repos.d/*.repo || true
          if ! dnf list fcitx5-devel >/dev/null 2>&1; then
            cat << 'EOF' > /etc/yum.repos.d/openEuler-24.09-epol.repo
          [openEuler-24.09-epol]
          name=openEuler 24.09 EPOL for Fcitx5
          baseurl=https://mirrors.huaweicloud.com/openeuler/openEuler-24.09/EPOL/main/$basearch/
          enabled=1
          gpgcheck=0
          priority=99
          EOF
          fi
          dnf makecache || true
          dnf install -y --nogpgcheck \
            gcc gcc-c++ cmake make pkgconf-pkg-config \
            sqlite-devel boost-devel \
            fcitx5-devel libime-devel \
            gtk3-devel pango-devel cairo-devel rpm-build tar

      - name: Configure and build on openEuler
        run: |
          cmake -S . -B build/oe -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DMODERNIME_BUILD_FCITX5=ON \
            -DMODERNIME_BUILD_LIBIME_PINYIN=ON \
            -DMODERNIME_BUILD_SETTINGS=ON \
            -DMODERNIME_BUILD_TESTS=OFF
          cmake --build build/oe --parallel $(nproc)

      - name: Generate and verify RPM package
        run: |
          cd build/oe
          cpack -G RPM
          ls -lh *.rpm
          rpm -qpi *.rpm
          rpm -qpl *.rpm
