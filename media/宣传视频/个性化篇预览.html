<script>
const film=document.getElementById('film');
document.querySelectorAll('[data-quality]').forEach(button=>button.addEventListener('click',()=>{
  const time=film.currentTime,playing=!film.paused;
  film.src=`output/v3/ModernIME-个性化篇-${button.dataset.quality}-60fps.mp4`;
  film.addEventListener('loadedmetadata',()=>{film.currentTime=Math.min(time,film.duration);if(playing)film.play().catch(()=>{});},{once:true});
  document.querySelectorAll('[data-quality]').forEach(item=>item.setAttribute('aria-pressed',String(item===button)));
}));
document.querySelectorAll('[data-time]').forEach(button=>button.addEventListener('click',()=>{film.currentTime=Number(button.dataset.time);film.play().catch(()=>{});}));
</script>
